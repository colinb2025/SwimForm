<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SwimForm{% endblock %}</title>
  <link rel="preload" href="/static/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/">SwimForm</a>
    <nav class="nav" aria-label="Account">
      {% if user %}
      <a href="/">Your reports</a>
      <a href="/analyses/new">New analysis</a>
      <a href="/guide">Filming guide</a>
      <form action="/logout" method="post" class="nav-form"><button type="submit" class="link-button">Log out</button></form>
      {% else %}
      <a href="/guide">Filming guide</a>
      <a href="/login">Log in</a>
      {% endif %}
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script>
    /* Show stored UTC times in the reader's own time zone. */
    document.querySelectorAll("time[data-local]").forEach(function (t) {
      var d = new Date(t.getAttribute("datetime"));
      if (isNaN(d)) return;
      var opts = { day: "numeric", month: "short", year: "numeric" };
      if (t.dataset.local === "datetime") { opts.hour = "numeric"; opts.minute = "2-digit"; }
      t.textContent = d.toLocaleString(undefined, opts);
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
