[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swimform"
version = "0.1.0"
description = "Freestyle swim technique analysis: pose estimation, biomechanical metrics, and a rules engine mapping measurements to drills."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Pose estimation and fine-tuning. Pinned separately because ultralytics is
# AGPL-3.0: fine for research, needs a commercial licence or a different
# backbone (e.g. RTMPose, Apache-2.0) before this ships as a product.
pose = ["ultralytics>=8.3", "torch>=2.1"]
label = ["label-studio>=1.11"]
# Web app (app/): run from the repo root with `uvicorn app.main:app --reload`.
app = ["fastapi>=0.110", "jinja2>=3.1", "python-multipart>=0.0.9", "uvicorn>=0.29", "sqlalchemy>=2.0", "httpx>=0.27"]
# Only for a Postgres SWIMFORM_DB (postgresql+psycopg://...).
postgres = ["psycopg[binary]>=3.1"]
# Only for SWIMFORM_EMAIL=ses (Amazon SES).
ses = ["boto3>=1.34"]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
